edition.workspace = true
license.workspace = true

[lib]
name = "codex_overmind_pipelines"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock"] }
indexmap = { workspace = true, features = ["serde"] }
